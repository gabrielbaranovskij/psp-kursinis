<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maisto įrašai – prototipas</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1db; --accent:#2f6f4f; --warn:#a15c00; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  main > section { min-width: 0; }
  .scroll { overflow-x: auto; }
  @media (max-width: 560px) {
    main { padding: 10px; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    header { padding: 10px 12px; }
    header label { flex: 1 1 100%; }
    section { padding: 12px; }
    .row, .row2, .add-person { grid-template-columns: 1fr 1fr !important; }
    .add-person > div:first-child { grid-column: 1 / -1; }
    table.totals tr { display:grid; grid-template-columns: 1fr 1fr; }
    .hide-sm { display: none; }
    th, td { padding: 6px 4px; }
  }
  .scan { width:100%; padding:12px; font-size:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--muted); margin:6px 0 2px; }
  input, select, textarea, button { font:inherit; }
  input, select, textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
  .row2 { display:grid; grid-template-columns: 2fr 1fr; gap:8px; }
  button { padding:7px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; margin-top:10px; }
  button.ghost { background:#fff; color:var(--accent); }
  button.danger { border-color:var(--err); background:#fff; color:var(--err); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; background:#eef3ef; color:var(--accent); }
  .badge.ai { background:#f3eefb; color:#5b3f99; }
  .badge.barcode { background:#eef2f8; color:#2c4f86; }
  .missing { color:var(--warn); }
  .msg { margin-top:10px; padding:8px 10px; border-radius:6px; font-size:14px; display:none; }
  .msg.err { display:block; background:#fdecea; color:var(--err); }
  .msg.ok { display:block; background:#e9f4ee; color:var(--accent); }
  .draft { border:1px dashed #b9a6dd; border-radius:8px; padding:10px; margin-bottom:10px; background:#fbf9ff; }
  .warn { color:var(--warn); font-size:13px; margin:4px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .totals .val { font-size:20px; font-weight:600; }
  #people tr.person { cursor:pointer; }
  #people tr.person:hover { background:#f6f8f6; }
  #people tr.selected { background:#e9f4ee; }
  #people tr.selected td:first-child { font-weight:600; }
  .bar { height:6px; background:#eceae4; border-radius:3px; overflow:hidden; margin-top:3px; min-width:80px; }
  .bar span { display:block; height:100%; background:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Maisto įrašai · valgio įrašo sudarymas</h1>
  <label style="margin:0">Klientas
    <select id="tenant">
      <option value="demo-balansas">Dietologų kabinetas „Balansas“</option>
      <option value="demo-nutriplan">Mitybos centras „NutriPlan“</option>
    </select>
  </label>
  <label style="margin:0">Data <input type="date" id="date"></label>
</header>

<main>
  <section class="wide">
    <h2>Kabineto pacientai</h2>
    <div id="people"></div>
    <div class="row add-person" style="grid-template-columns: 2fr 1fr auto; align-items:end">
      <div><label>Naujas pacientas</label><input id="p-name" placeholder="Vardas Pavardė"></div>
      <div><label>Dienos tikslas, kcal</label><input id="p-kcal" type="number" min="0" placeholder="2000"></div>
      <div><button onclick="addPerson()">Pridėti</button></div>
    </div>
    <div class="msg" id="p-msg"></div>
  </section>

  <section class="wide">
    <h2>Dienos suvestinė: <span id="person-name">—</span></h2>
    <div id="summary"></div>
  </section>

  <section>
    <h2>Iš bibliotekos</h2>
    <div class="row2">
      <div><label>Produktas</label><select id="lib-product"></select></div>
      <div><label>Gramai</label><input id="lib-grams" type="number" value="150" min="1"></div>
    </div>
    <button onclick="addFromLibrary()">Įrašyti</button>
    <div class="msg" id="lib-msg"></div>
  </section>

  <section>
    <h2>Brūkšninis kodas</h2>
    <input id="bc-photo" type="file" accept="image/*" capture="environment" hidden>
    <button class="ghost scan" style="margin-top:0" onclick="$('bc-photo').click()">📷 Skenuoti kamera</button>
    <div class="row2">
      <div><label>Kodas (6–14 skaitmenų)</label><input id="bc-code" placeholder="5449000000996"></div>
      <div><label>Gramai</label><input id="bc-grams" type="number" value="100" min="1"></div>
    </div>
    <button onclick="addFromBarcode()">Įrašyti</button>
    <button class="ghost" onclick="lookupBarcode()">Tik ieškoti</button>
    <div class="msg" id="bc-msg"></div>
  </section>

  <section>
    <h2>Ranka</h2>
    <div class="row2">
      <div><label>Pavadinimas</label><input id="m-name" placeholder="Varškės sūrelis"></div>
      <div><label>Gramai</label><input id="m-grams" type="number" value="100" min="1"></div>
    </div>
    <label>Vertė 100 g (tuščia = nežinoma, ne 0)</label>
    <div class="row">
      <input id="m-kcal" type="number" placeholder="kcal" min="0">
      <input id="m-p" type="number" placeholder="baltymai g" min="0">
      <input id="m-c" type="number" placeholder="angliav. g" min="0">
      <input id="m-f" type="number" placeholder="riebalai g" min="0">
    </div>
    <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input id="m-save" type="checkbox" style="width:auto"> išsaugoti bibliotekoje</label>
    <button onclick="addManual()">Įrašyti</button>
    <div class="msg" id="m-msg"></div>
  </section>

  <section>
    <h2>AI įvertinimas (nuotrauka ir / ar tekstas)</h2>
    <label>Nuotrauka (sumažinama iki 1024 px)</label>
    <input id="ai-file" type="file" accept="image/*">
    <label>Aprašymas (≤ 280 simbolių)</label>
    <textarea id="ai-hint" rows="2" maxlength="280" placeholder="200 g makaronų su sūriu"></textarea>
    <button onclick="estimate()">Įvertinti</button>
    <div class="msg" id="ai-msg"></div>
    <p class="muted">AI rezultatas į dienos sumą nepatenka, kol jo nepatvirtinate.</p>
  </section>

  <section class="wide">
    <h2>Laukia patvirtinimo</h2>
    <div id="drafts"><p class="muted">Nėra.</p></div>
  </section>

  <section class="wide">
    <h2>Įrašai</h2>
    <div id="entries"></div>
  </section>
</main>

<script src="/vendor/zxing/index.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const LABELS = { kcal: 'Kalorijos', proteinG: 'Baltymai', carbG: 'Angliavandeniai', fatG: 'Riebalai' };
const UNITS = { kcal: 'kcal', proteinG: 'g', carbG: 'g', fatG: 'g' };
const SOURCE = { manual: 'ranka', barcode: 'brūkšn. kodas', ai: 'AI' };

$('date').value = new Date().toISOString().slice(0, 10);
let personId = null;
$('tenant').onchange = () => { personId = null; refresh(); };
$('date').onchange = refresh;

async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: { 'x-api-key': $('tenant').value, ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`${res.status} · ${data.message || data.error || 'Klaida'}`);
  return data;
}

function show(id, text, ok) { const el = $(id); el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }
function clear(id) { $(id).className = 'msg'; }
const num = (v) => v === '' || v === null || v === undefined ? null : Number(v);
const fmt = (v) => v === null ? '<span class="missing">—</span>' : v;

const P = () => `/people/${personId}`;

async function refresh() {
  const date = $('date').value;
  const people = await api('GET', '/people?date=' + date);
  if (!people.some((p) => p.id === personId)) personId = people[0]?.id ?? null;
  renderPeople(people);
  if (!personId) return;
  const [day, products, drafts] = await Promise.all([
    api('GET', `${P()}/days/${date}`),
    api('GET', '/products'),
    api('GET', `${P()}/estimates?date=${date}`),
  ]);
  $('person-name').textContent = day.person.name;
  renderSummary(day);
  renderEntries(day.entries);
  renderDrafts(drafts);
  $('lib-product').innerHTML = products.map((p) =>
    `<option value="${p.id}">${esc(p.name)} (${p.per100g.kcal ?? '—'} kcal/100 g)</option>`).join('');
}

function renderPeople(people) {
  if (!people.length) { $('people').innerHTML = '<p class="muted">Pacientų dar nėra.</p>'; return; }
  $('people').innerHTML = `<div class="scroll"><table><tr><th>Pacientas</th><th class="num">kcal šiandien</th><th>Tikslas</th><th class="num">Likutis</th>
      <th class="num hide-sm">Įrašai</th><th class="num hide-sm">Laukia patvirt.</th><th class="hide-sm">Trūksta duomenų</th></tr>
    ${people.map((p) => {
      const k = p.totals.kcal;
      const pct = k.goal ? Math.min(100, Math.round(((k.value ?? 0) / k.goal) * 100)) : 0;
      const missing = Object.keys(LABELS).filter((key) => p.totals[key].missingIn > 0).map((key) => LABELS[key].toLowerCase());
      return `<tr class="person ${p.id === personId ? 'selected' : ''}" onclick="selectPerson('${p.id}')">
        <td>${esc(p.name)}</td>
        <td class="num">${k.value === null ? fmt(null) : (k.complete ? k.value : '≥ ' + k.value)}</td>
        <td>${k.goal ?? '<span class="muted">nenustatytas</span>'}${k.goal ? `<div class="bar"><span style="width:${pct}%"></span></div>` : ''}</td>
        <td class="num">${k.remaining ?? '—'}</td>
        <td class="num hide-sm">${p.entryCount}</td>
        <td class="num hide-sm">${p.pendingDrafts || ''}</td>
        <td class="missing hide-sm">${missing.join(', ')}</td></tr>`;
    }).join('')}</table></div>
    <p class="muted">Paspauskite pacientą – žemiau įrašai ir valgiai bus jo.</p>`;
}

function selectPerson(id) { personId = id; refresh(); }

async function addPerson() {
  clear('p-msg');
  try {
    const kcal = num($('p-kcal').value);
    const body = { name: $('p-name').value };
    if (kcal !== null) body.goal = { kcal, proteinG: null, carbG: null, fatG: null };
    const p = await api('POST', '/people', body);
    personId = p.id; $('p-name').value = ''; $('p-kcal').value = '';
    refresh();
  } catch (err) { show('p-msg', err.message); }
}

function renderSummary(day) {
  const cells = Object.keys(LABELS).map((k) => {
    const t = day.totals[k];
    let value;
    if (t.value === null) value = '<span class="missing">—</span>';
    else if (!t.complete) value = `<span class="missing">≥ ${t.value}</span>`;
    else value = t.value;
    const missing = t.missingIn > 0 ? `<div class="missing" style="font-size:12px">trūksta ${t.missingIn} įraš.</div>` : '';
    const goal = t.goal !== null ? `<div class="muted">tikslas ${t.goal} ${UNITS[k]} · likutis ${t.remaining ?? '—'}</div>` : '<div class="muted">tikslas nenustatytas</div>';
    return `<td><div class="muted">${LABELS[k]}</div><div class="val">${value} <span class="muted">${UNITS[k]}</span></div>${missing}${goal}</td>`;
  }).join('');
  const pending = day.pendingDrafts ? `<p class="warn">${day.pendingDrafts} AI įvertinimas(-ai) laukia patvirtinimo ir į sumą neįskaičiuoti.</p>` : '';
  $('summary').innerHTML = `<table class="totals"><tr>${cells}</tr></table>${pending}
    <p class="muted">„—“ – vertė nežinoma (ne 0). „≥“ – suma be įrašų, kuriems vertė nežinoma; likutis tada nerodomas.</p>`;
}

function renderEntries(entries) {
  if (!entries.length) { $('entries').innerHTML = '<p class="muted">Šiai dienai įrašų nėra.</p>'; return; }
  $('entries').innerHTML = `<div class="scroll"><table><tr><th>Pavadinimas</th><th>Šaltinis</th><th class="num">g</th><th class="num">kcal</th><th class="num">B</th><th class="num">A</th><th class="num">R</th><th></th></tr>
    ${entries.map((e) => `<tr><td>${esc(e.name)}</td><td><span class="badge ${e.source}">${SOURCE[e.source]}</span></td>
      <td class="num">${e.grams}</td><td class="num">${fmt(e.nutrients.kcal)}</td><td class="num">${fmt(e.nutrients.proteinG)}</td>
      <td class="num">${fmt(e.nutrients.carbG)}</td><td class="num">${fmt(e.nutrients.fatG)}</td>
      <td><button class="danger" style="margin:0;padding:2px 8px" onclick="del('${e.id}')">×</button></td></tr>`).join('')}</table></div>`;
}

function renderDrafts(drafts) {
  if (!drafts.length) { $('drafts').innerHTML = '<p class="muted">Nėra.</p>'; return; }
  $('drafts').innerHTML = drafts.map((d) => {
    const e = d.estimate;
    const corr = e.corrections.length ? `<p class="warn">⚠ Pataisyta: ${e.corrections.map((c) => `${c.field} ${c.from} → ${c.to}`).join(', ')}</p>` : '';
    const nf = e.notFood ? `<p class="warn">⚠ AI mano, kad tai ne maistas. Patvirtinti galima tik įvedus vertes, arba atmeskite.</p>` : '';
    const low = e.confidence === 'low' ? `<p class="warn">Mažas patikimumas – patikrinkite vertes.</p>` : '';
    const n = e.nutrients;
    return `<div class="draft" id="d-${d.id}">
      <b>${esc(e.name)}</b> · ${e.portionGrams} g · ${n.kcal} kcal, B ${n.proteinG}, A ${n.carbG}, R ${n.fatG}
      <span class="muted">(patikimumas: ${e.confidence})</span>
      <div class="muted">${esc(e.note)}</div>${corr}${nf}${low}
      <div class="row" style="margin-top:6px">
        <div><label>Suvalgyta g</label><input id="dg-${d.id}" type="number" value="${e.portionGrams}"></div>
        ${e.notFood ? `<div><label>kcal</label><input id="dk-${d.id}" type="number" min="0"></div>
          <div><label>B / A / R (g)</label><input id="dm-${d.id}" placeholder="10/20/5"></div>` : ''}
      </div>
      <button onclick="confirmDraft('${d.id}', ${e.notFood})">Patvirtinti</button>
      <button class="ghost" onclick="discardDraft('${d.id}')">Atmesti</button>
      <div class="msg" id="dmsg-${d.id}"></div>
    </div>`;
  }).join('');
}

async function addFromLibrary() {
  clear('lib-msg');
  try {
    const e = await api('POST', `${P()}/entries/product`, { date: $('date').value, productId: $('lib-product').value, grams: num($('lib-grams').value) });
    show('lib-msg', `Įrašyta: ${e.name}, ${e.nutrients.kcal ?? '—'} kcal`, true); refresh();
  } catch (err) { show('lib-msg', err.message); }
}

async function addFromBarcode() {
  clear('bc-msg');
  try {
    const e = await api('POST', `${P()}/entries/barcode`, { date: $('date').value, barcode: $('bc-code').value.trim(), grams: num($('bc-grams').value) });
    show('bc-msg', `Įrašyta: ${e.name}, ${e.nutrients.kcal ?? '—'} kcal`, true); refresh();
  } catch (err) { show('bc-msg', err.message); }
}

$('bc-photo').onchange = async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  show('bc-msg', 'Skaitomas kodas…', true);
  try {
    const code = await decodeBarcode(file);
    $('bc-code').value = code;
    await lookupBarcode();
  } catch (err) { show('bc-msg', err.message); }
};

async function lookupBarcode() {
  clear('bc-msg');
  try {
    const p = await api('GET', '/barcode/' + encodeURIComponent($('bc-code').value.trim()));
    const v = p.per100g;
    show('bc-msg', `Rasta: ${p.name} – ${v.kcal ?? '—'} kcal, B ${v.proteinG ?? '—'}, A ${v.carbG ?? '—'}, R ${v.fatG ?? '—'} / 100 g. Įveskite gramus ir spauskite „Įrašyti“.`, true);
    refresh();
  } catch (err) { show('bc-msg', err.message); }
}

/**
 * Brūkšninis kodas iš nuotraukos. Naršyklės BarcodeDetector (jei yra), kitaip ZXing.
 * Nuotrauka sumažinama ir, nepavykus, bandoma pasukta – telefonu kodas dažnai būna šonu.
 */
async function decodeBarcode(file) {
  const img = await loadImage(file);
  if ('BarcodeDetector' in window) {
    try {
      const found = await new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] }).detect(img);
      if (found[0]) return found[0].rawValue;
    } catch { /* toliau ZXing */ }
  }
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.BrowserMultiFormatReader(hints);
  for (const size of [1600, 1000, 2400]) {
    for (const rotate of [0, 90]) {
      try {
        const result = await reader.decodeFromImageUrl(drawScaled(img, size, rotate));
        return result.getText();
      } catch { /* kitas bandymas */ }
    }
  }
  throw new Error('Kodo nepavyko nuskaityti. Fotografuokite arčiau, kad kodas būtų ryškus ir per visą plotį, arba įveskite ranka.');
}

/**
 * Nuotrauka -> piešiamas vaizdas: <img>, nepavykus createImageBitmap.
 * HEIC (iPhone) dažnai neatidaro jokia naršyklė, išskyrus Safari.
 */
async function loadImage(file) {
  try {
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  } catch {
    if ('createImageBitmap' in window) {
      try { return await createImageBitmap(file); } catch { /* žemiau klaida */ }
    }
    throw new Error(unreadableMessage(file));
  }
}

function isHeic(file) {
  return /hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name || '');
}

function unreadableMessage(file) {
  const mb = (file.size / 1024 / 1024).toFixed(1);
  const type = file.type || (file.name || '').split('.').pop() || 'nežinomas';
  return `Naršyklė negali atidaryti šios nuotraukos (${type}, ${mb} MB).` +
    (isHeic(file) ? ' Tai iPhone HEIC formatas: Nustatymai → Kamera → Formatai → „Labiausiai suderinamas“ (JPEG).' : ' Pabandykite dar kartą arba pasirinkite JPEG nuotrauką.');
}

function drawScaled(img, maxSide, rotate) {
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = rotate ? h : w; canvas.height = rotate ? w : h;
  const ctx = canvas.getContext('2d');
  if (rotate) { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); }
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.92);
}

async function addManual() {
  clear('m-msg');
  try {
    const e = await api('POST', `${P()}/entries/manual`, {
      date: $('date').value, name: $('m-name').value, grams: num($('m-grams').value), saveToLibrary: $('m-save').checked,
      per100g: { kcal: num($('m-kcal').value), proteinG: num($('m-p').value), carbG: num($('m-c').value), fatG: num($('m-f').value) },
    });
    show('m-msg', `Įrašyta: ${e.name}, ${e.nutrients.kcal ?? '—'} kcal`, true); refresh();
  } catch (err) { show('m-msg', err.message); }
}

async function estimate() {
  clear('ai-msg');
  try {
    const body = { date: $('date').value };
    const hint = $('ai-hint').value.trim();
    if (hint) body.hint = hint;
    const file = $('ai-file').files[0];
    if (file) Object.assign(body, await downscale(file));
    show('ai-msg', 'Siunčiama…', true);
    await api('POST', `${P()}/estimates`, body);
    show('ai-msg', 'Įvertinimas paruoštas – patvirtinkite arba atmeskite žemiau.', true); refresh();
  } catch (err) { show('ai-msg', err.message); }
}

async function confirmDraft(id, notFood) {
  try {
    const body = { grams: num($('dg-' + id).value) };
    if (notFood) {
      const [p, c, f] = ($('dm-' + id).value || '').split('/').map((x) => num(x?.trim()));
      body.nutrients = { kcal: num($('dk-' + id).value), proteinG: p ?? null, carbG: c ?? null, fatG: f ?? null };
    }
    await api('POST', `/estimates/${id}/confirm`, body); refresh();
  } catch (err) { show('dmsg-' + id, err.message); }
}

async function discardDraft(id) {
  try { await api('POST', `/estimates/${id}/discard`); refresh(); } catch (err) { show('dmsg-' + id, err.message); }
}

async function del(id) { await api('DELETE', '/entries/' + id); refresh(); }

/** Ilgesnė kraštinė iki 1024 px, JPEG – kaip numatyta I etape. */
async function downscale(file) {
  let img;
  try {
    img = await loadImage(file);
  } catch (err) {
    // HEIC naršyklė neatidaro, bet Gemini jį priima: siunčiame originalą, jei telpa į 4 MB.
    if (isHeic(file) && file.size <= 4 * 1024 * 1024) {
      const data = await new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(file); });
      return { image: String(data).split(',')[1], mimeType: 'image/heic' };
    }
    throw err;
  }
  const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return { image: canvas.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg' };
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

refresh().catch((err) => { $('summary').innerHTML = `<div class="msg err">${esc(err.message)}</div>`; });
</script>
